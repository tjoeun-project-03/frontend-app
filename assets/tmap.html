<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://apis.openapi.sk.com/tmap/jsv2?version=1&appKey=zevdfBBPeu3eQZItbMK1k812led3px8x2dr5r9sZ"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #map_div { width: 100%; height: 100%; }
    </style>
</head>
<body onload="initTmap()">
<div id="map_div"></div>
<script>
    var map;
    var markers = { start: null, end: null };
    var polyline = null;

    function initTmap() {
        map = new Tmapv2.Map("map_div", {
            center: new Tmapv2.LatLng(37.5665, 126.9780),
            width: "100%",
            height: "100%",
            zoom: 15,
            zoomControl: true, // 🚀 지도에 확대/축소 버튼 표시 추가
            scrollwheel: true  // 마우스 휠 및 줌 동작 허용
        });
    }

    function setMarker(lat, lon, type) {
        var position = new Tmapv2.LatLng(lat, lon);
        if (markers[type]) markers[type].setMap(null);

        var iconUrl = type === 'start'
            ? "https://tmapapi.sktelecom.com/upload/tmap/marker/pin_b_m_s.png"
            : "https://tmapapi.sktelecom.com/upload/tmap/marker/pin_b_m_e.png";

        markers[type] = new Tmapv2.Marker({
            position: position,
            map: map,
            icon: iconUrl,
            iconSize: new Tmapv2.Size(34, 44)
        });

        map.setCenter(position);
    }

    function drawRoute(sLat, sLng, eLat, eLng, apiKey) {
        if (polyline) polyline.setMap(null);

        var params = {
            "startX": sLng, "startY": sLat,
            "endX": eLng, "endY": eLat,
            "reqCoordType": "WGS84GEO", "resCoordType": "WGS84GEO",
            "searchOption": "0"
        };

        fetch("https://apis.openapi.sk.com/tmap/routes?version=1&format=json", {
            method: "POST",
            headers: { "Content-Type": "application/json", "appKey": apiKey },
            body: JSON.stringify(params)
        })
        .then(response => response.json())
        .then(data => {
            var resultFeatures = data.features;
            var lineArray = [];

            for (var i in resultFeatures) {
                var geometry = resultFeatures[i].geometry;
                if (geometry.type == "LineString") {
                    for (var j in geometry.coordinates) {
                        lineArray.push(new Tmapv2.LatLng(geometry.coordinates[j][1], geometry.coordinates[j][0]));
                    }
                }
            }

            polyline = new Tmapv2.Polyline({
                path: lineArray,
                strokeColor: "#1A2B88",
                strokeWeight: 6,
                map: map
            });

            // 🚀 출발/도착지가 다 보이도록 자동 줌 조절
            var bounds = new Tmapv2.LatLngBounds();
            bounds.extend(new Tmapv2.LatLng(sLat, sLng));
            bounds.extend(new Tmapv2.LatLng(eLat, eLng));
            map.fitBounds(bounds);
        })
        .catch(err => console.log("경로 그리기 실패: ", err));
    }
</script>
</body>
</html>
